services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docura}
      POSTGRES_USER: ${POSTGRES_USER:-docura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docura_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docura}:${POSTGRES_PASSWORD:-docura_change_me}@db:5432/${POSTGRES_DB:-docura}
      SECRET_KEY: ${SECRET_KEY:-docura-dev-secret-change-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      FILE_ENCRYPTION_ENABLED: ${FILE_ENCRYPTION_ENABLED:-false}
      FILE_ENCRYPTION_ACTIVE_KEY_ID: ${FILE_ENCRYPTION_ACTIVE_KEY_ID:-}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:-}
      FILE_ENCRYPTION_KEYS: ${FILE_ENCRYPTION_KEYS:-}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
